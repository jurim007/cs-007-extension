name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build Plugins
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          mkdir -p "$GITHUB_WORKSPACE/publish"
          find . -path '*/build/*.cs3' -type f -exec cp {} "$GITHUB_WORKSPACE/publish/" \;
          cp build/plugins.json "$GITHUB_WORKSPACE/publish/"

      - name: Publish builds branch
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/src"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          if git ls-remote --exit-code --heads origin builds >/dev/null; then
            git fetch origin refs/heads/builds
            git checkout -B builds FETCH_HEAD
          else
            ls_remote_status=$?
            if [ "$ls_remote_status" -ne 2 ]; then
              echo "Unable to check whether the builds branch exists." >&2
              exit "$ls_remote_status"
            fi
            git checkout --orphan builds
            git rm -rf .
          fi

          find . -maxdepth 1 -type f -name '*.cs3' -delete
          rm -f plugins.json
          cp "$GITHUB_WORKSPACE"/publish/*.cs3 .
          cp "$GITHUB_WORKSPACE/publish/plugins.json" .

          git add -A
          if git diff --cached --quiet; then
            echo "No published artifacts changed."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin builds
